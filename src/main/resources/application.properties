
spring.application.name=PortalSaudeRH

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/portal_saude_rh
spring.datasource.username=portal_user
spring.datasource.password=${DB_PASSWORD:portal_senha}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
portal.arquivos.diretorio=${PORTAL_ARQUIVOS_DIR:./arquivos-privados}

# Thymeleaf
spring.thymeleaf.cache=false

server.forward-headers-strategy=framework

# Fuso horário de Brasília
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
