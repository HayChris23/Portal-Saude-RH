<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Login - Portal Saúde RH</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7f9;
        padding: 20px;
    }

    .container {
        width: 900px;
        max-width: 95%;
        min-height: 520px;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 45% 55%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .left {
        background: #006b5f;
        color: white;
        padding: 55px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .left h1 {
        font-size: 32px;
        margin-bottom: 18px;
    }

    .left p {
        line-height: 1.6;
        opacity: 0.9;
    }

    .right {
        padding: 55px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .logo {
        margin-bottom: 35px;
    }

    .logo img {
        width: 180px;
        height: auto;
        display: block;
    }

    .right h2 {
        color: #243746;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #64748b;
        margin-bottom: 25px;
        font-size: 14px;
        line-height: 1.5;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    form label {
        color: #243746;
        font-size: 14px;
        font-weight: bold;
        margin-top: 8px;
    }

    form input {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }

    form input:focus {
        border-color: #006b5f;
    }

    .login-button {
        width: 100%;
        padding: 15px;
        margin-top: 12px;
        border: none;
        border-radius: 8px;
        background: #006b5f;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }

    .login-button:hover {
        background: #005449;
    }

    .erro {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 14px;
        text-align: center;
    }

    .info {
        margin-top: 25px;
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
        line-height: 1.5;
    }

    @media (max-width: 700px) {

        .container {
            grid-template-columns: 1fr;
        }

        .left {
            display: none;
        }

        .right {
            padding: 40px 30px;
        }
    }

</style>


</head>

<body>


<div class="container">

    <div class="left">

        <h1>Portal Saúde RH</h1>

        <p>
            Um canal digital para facilitar as solicitações,
            o acompanhamento e a consulta de informações
            relacionadas aos benefícios de saúde.
        </p>

    </div>

    <div class="right">

        <div class="logo">
            <img src="/images/logo-findes.png" alt="FINDES">
        </div>

        <h2>Acesse o Portal</h2>

        <p class="subtitle">
            Utilize sua conta corporativa para acessar os serviços
            disponíveis.
        </p>

        <form action="/login" method="post">

            <label for="email">E-mail corporativo</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit" class="login-button">
                Entrar com conta corporativa
            </button>

        </form>

        <div th:if="${erro}" class="erro">
            <span th:text="${erro}"></span>
        </div>

        <div class="info">
            Acesso destinado aos colaboradores autorizados.
        </div>

    </div>

</div>

</body>

</html>
